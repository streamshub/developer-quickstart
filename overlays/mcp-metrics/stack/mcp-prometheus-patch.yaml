apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamshub-strimzi-mcp
  namespace: streamshub-mcp
spec:
  template:
    spec:
      containers:
        - name: strimzi-mcp
          env:
            - name: MCP_METRICS_PROVIDER
              value: "streamshub-prometheus"
            - name: QUARKUS_REST_CLIENT_PROMETHEUS_URL
              value: "http://prometheus-operated.monitoring.svc:9090"
