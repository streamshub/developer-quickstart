# Test matrix configuration for CI smoke tests.
#
# ComputeTestMatrix.java reads this file to enrich the dynamically
# computed test matrix with per-overlay test settings.
#
# The matrix is computed automatically from overlay component
# dependencies — only "leaf" overlays (those not fully covered by
# a larger overlay) are tested. This file provides additional
# test-specific configuration that doesn't belong in the overlay
# definitions themselves.
#
# Structure:
#   overlays:
#     <overlay-name>:
#       condition-overrides: "<apiGroup>=<Condition> ..." or "<apiGroup>/<Kind>=<Condition> ..."
#
# Fields:
#   condition-overrides  Space-separated list of overrides, each either
#                        apiGroup=Condition or the more specific
#                        apiGroup/Kind=Condition (which takes precedence
#                        when both match a resource). During verification,
#                        custom resources matching the given API group (and
#                        Kind, if specified) will be checked for the given
#                        condition instead of the default "Ready".

overlays:
  metrics:
    condition-overrides: "monitoring.coreos.com=Available"
  mcp-metrics:
    condition-overrides: "monitoring.coreos.com=Available"
  kroxylicious:
    condition-overrides: >-
      kroxylicious.io/KafkaProxyIngress=Accepted
      kroxylicious.io/KafkaService=ResolvedRefs
      kroxylicious.io/VirtualKafkaCluster=Accepted
      kroxylicious.io/KafkaProtocolFilter=ResolvedRefs
